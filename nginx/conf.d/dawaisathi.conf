# Nginx reverse proxy configuration for DawaiSathi on VPS
# Domain: dawaisathi.georbit.org

upstream backend_service {
    server backend:5000;
}

upstream frontend_service {
    server frontend:80;
}

# 1. HTTP server (Handles ACME challenges for Let's Encrypt + redirects to HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name dawaisathi.georbit.org;

    # Let's Encrypt challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS (once cert is generated, otherwise proxy temporarily)
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS server (Production secure setup)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dawaisathi.georbit.org;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/dawaisathi.georbit.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dawaisathi.georbit.org/privkey.pem;

    # Recommended secure SSL parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Client upload size (Prescription scans can be up to 16MB)
    client_max_body_size 25M;

    # Frontend SPA routing
    location / {
        proxy_pass http://frontend_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API endpoints
    location /api/ {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 15s;
    }

    # Uploads (static file serving through backend)
    location /uploads/ {
        proxy_pass http://backend_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
